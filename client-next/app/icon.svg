<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f472b6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="10" />
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#ambientGlow)" />

  <!-- Monogram NQ (Ngô Chí Quốc) -->
  <g filter="url(#dropGlow)">
    <!-- Letter N in Brand Gradient -->
    <path d="M 112 352 L 112 160 L 158 160 L 238 288 L 238 160 L 280 160 L 280 352 L 234 352 L 154 224 L 154 352 Z" fill="url(#brandGrad)" />
    
    <!-- Letter Q in Pure Crisp Titanium -->
    <!-- Outer ellipse of Q -->
    <path d="M 364 156 C 308 156 268 198 268 256 C 268 314 308 356 364 356 C 384 356 402 349 416 338 L 436 360 L 460 336 L 438 312 C 452 296 460 276 460 256 C 460 198 420 156 364 156 Z M 364 314 C 332 314 310 289 310 256 C 310 223 332 198 364 198 C 396 198 418 223 418 256 C 418 289 396 314 364 314 Z" fill="#f8fafc" />
  </g>

  <!-- Top-Right Available for Work Status Indicator -->
  <circle cx="416" cy="96" r="12" fill="#22c55e" />
  <circle cx="416" cy="96" r="20" fill="#22c55e" opacity="0.3" />
</svg>
